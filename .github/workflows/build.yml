name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest numpy
      - run: python -m pytest -q tests
      - name: Check the window code loads
        run: python -c "import filehunter"

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: FileHunter-windows.zip
          - os: macos-latest
            artifact: FileHunter-macos.zip
          - os: ubuntu-latest
            artifact: FileHunter-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pillow opencv-python-headless numpy
      - run: python build.py
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/FileHunter.exe -DestinationPath ${{ matrix.artifact }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../${{ matrix.artifact }} FileHunter.app
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }} -C dist FileHunter
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FileHunter-windows.zip
            FileHunter-macos.zip
            FileHunter-linux.tar.gz
          generate_release_notes: true
